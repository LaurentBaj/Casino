name: .NET Tests

on:
  push:

  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.fsproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Casino.sln

      - name: Build
        run: dotnet build Casino.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Casino.sln --configuration Release --no-build --logger trx --results-directory "TestResults"

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: .NET Tests Report
          path: TestResults/*.trx
          reporter: dotnet-trx
