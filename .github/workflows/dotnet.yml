name: .NET Tests

on:
  push:

  pull_request:
    branches:
      - master

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Casino.sln

      - name: Build
        run: dotnet build Casino.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Casino.sln --configuration Release --no-build
