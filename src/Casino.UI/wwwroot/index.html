<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino WebSocket Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #log { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Casino Game WebSocket Client</h1>

    <div id="log"></div>

    <input type="text" id="messageInput" placeholder="Enter a move (e.g. Play Card X)" style="width: 300px;"/>
    <button id="sendBtn" disabled>Send</button>

    <script>
        const logDiv = document.getElementById('log');
        const input = document.getElementById('messageInput');
        const btn = document.getElementById('sendBtn');

        function logMsg(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Connect to WebSocket on the same host, path /ws
        const wsUrl = `ws://${window.location.host}/ws`;
        logMsg(`Connecting to ${wsUrl}...`);

        const socket = new WebSocket(wsUrl);

        socket.onopen = function (e) {
            logMsg("Connection established.");
            btn.disabled = false;
        };

        socket.onmessage = function (e) {
            logMsg(`[Server]: ${e.data}`);
        };

        socket.onclose = function (e) {
            logMsg(`Connection closed. Code: ${e.code}, Reason: ${e.reason}`);
            btn.disabled = true;
        };

        socket.onerror = function (error) {
            logMsg(`WebSocket Error: ${error}`);
        };

        btn.addEventListener('click', () => {
            if (input.value) {
                logMsg(`[You]: ${input.value}`);
                socket.send(input.value);
                input.value = '';
            }
        });

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                btn.click();
            }
        });
    </script>
</body>
</html>
